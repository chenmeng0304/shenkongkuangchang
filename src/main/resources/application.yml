server:
  port: ${PORT:8081}
  # 云托管里必须监听所有网卡，否则健康检查连不上（Readiness/Liveness 失败）
  address: 0.0.0.0
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,text/javascript,application/javascript
  error:
    include-message: always

spring:
  application:
    name: deepmine-server
  datasource:
    # 微信云托管会自动注入 MYSQL_ADDRESS / MYSQL_USERNAME / MYSQL_PASSWORD；
    # 自建服务器继续用 DB_URL / DB_USER / DB_PASSWORD（优先级更高）
    url: ${DB_URL:jdbc:mysql://${MYSQL_ADDRESS:127.0.0.1:3306}/${DB_NAME:deepmine}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USER:${MYSQL_USERNAME:deepmine}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:deepmine123}}
    hikari:
      maximum-pool-size: ${DB_POOL:10}
      connection-timeout: 10000
      # 云数据库冷启动可能十几秒，别一连接失败就退出（会导致 80 端口 connection refused）
      initialization-fail-timeout: ${DB_INIT_TIMEOUT:60000}
  jpa:
    open-in-view: false
    # 显式指定方言：否则 Hibernate 启动时要连数据库读元数据，连不上就直接退出
    # （云端表现为 80 端口 connection refused，看不到真正原因）
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: false
  flyway:
    # 关掉 Spring 自带的 Flyway 自动迁移：改由 FlywayMigrator 手动跑，失败也继续启动
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai

app:
  jwt:
    secret: ${APP_JWT_SECRET:deepmine-dev-secret-please-change-in-production-0123456789}
    ttl-hours: ${APP_JWT_TTL_HOURS:720}
  static-dir: ${APP_STATIC_DIR:}
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  boss:
    attack-cooldown-seconds: ${BOSS_COOLDOWN:12}
    period-seconds: ${BOSS_PERIOD:86400}
  pvp:
    battle-cooldown-seconds: ${PVP_COOLDOWN:10}
  # 微信登录：小程序/小游戏的 AppID 与 AppSecret（云托管环境变量里填）
  wx:
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    # 信任平台注入的 X-WX-OPENID（微信云托管默认注入，用它登录就**不需要 AppSecret**）
    # 自建公网服务器建议用环境变量改成 false，避免被伪造请求头
    trust-openid-header: ${WX_TRUST_OPENID:true}
    # 容器根证书导入失败时的逃生开关（会跳过 TLS 校验，仅调试用）
    # 证书校验失败时自动降级重试一次（会打 WARN）；设成 false 恢复严格模式
    insecure-tls: ${WX_INSECURE_TLS:true}

# 云托管排查用：把启动失败原因（Flyway / 连接池）完整打到 stdout
logging:
  level:
    root: INFO
    com.deepmine: INFO
    org.flywaydb: INFO
    com.zaxxer.hikari: INFO
    org.springframework.boot.web.embedded.tomcat: INFO
