spring:
  datasource:
    url: jdbc:h2:mem:deepmine;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  jackson:
    time-zone: Asia/Shanghai

app:
  jwt:
    secret: deepmine-test-secret-0123456789-abcdefghijklmnop
    ttl-hours: 1
  static-dir: ""
  cors-origins: http://localhost:*
  boss:
    attack-cooldown-seconds: 12
    respawn-seconds: 300
  pvp:
    battle-cooldown-seconds: 20
  wx:
    # 测试里没有真实 AppSecret，只验证平台注入 X-WX-OPENID 的分支
    trust-openid-header: true

logging:
  level:
    root: WARN
    com.deepmine: INFO
